<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Return to your display · Spcrtify</title>
  <link rel="stylesheet" href="style.css">
  <script src="callback.js" defer></script>
</head>
<body>
  <main>
    <p class="brand">Spcrtify</p>
    <h1 id="heading">One last step.</h1>
    <p id="message">Return to your display to finish connecting Spotify.</p>
    <a id="return-link" class="button" hidden rel="noreferrer">Return to Spcrtify</a>
    <p id="wifi-note" class="note" hidden>Keep this phone on the same Wi-Fi as your display. If your browser asks to open a local address, allow it.</p>
    <p class="footnote">Spotify tokens are saved on your display. This page handles only a temporary sign-in code.</p>
    <noscript><p>Enable JavaScript to finish sign-in, then scan the display again.</p></noscript>
  </main>

</html>
